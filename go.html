<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>联机五子棋</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,-apple-system,sans-serif}
body{background:#f5f5f5;padding:16px;max-width:1000px;margin:0 auto}
h2{text-align:center;margin-bottom:16px;color:#222}
.panel{background:#fff;padding:14px;border-radius:10px;margin-bottom:14px;box-shadow:0 1px 4px #00000018}
input,button{padding:8px 10px;font-size:14px;border-radius:6px;border:1px solid #ccc}
button{background:#407bff;color:#fff;border:none;cursor:pointer}
button:disabled{background:#aaa;cursor:not-allowed}
.oper-row{margin:8px 0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tip-text{font-size:12px;color:#555;margin-left:10px}
#board{background:#deb887;margin:12px auto;display:block;border:4px solid #8b4513}
.info{margin:8px 0;color:#333}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:8px;display:none;z-index:9999;max-width:90%}
</style>
</head>
<body>
<h2>联机五子棋</h2>

<div class="panel">
  <div class="oper-row">
    <input id="myId" placeholder="你的房间ID">
    <button onclick="createRoom()">创建房间</button>
  </div>
  <div class="oper-row">
    <input id="targetId" placeholder="输入对方房间ID">
    <button onclick="connectPeer()">连接对手</button>
  </div>
  <div class="oper-row">
    <button id="notifyBtn">开启桌面通知</button>
    <span class="tip-text">💡 如果没有弹出允许通知，请点击浏览器搜索栏右侧铃铛标志</span>
  </div>
  <div class="info">状态：<span id="status">等待连接</span></div>
</div>

<canvas id="board" width="480" height="480"></canvas>

<div class="toast" id="toastBox"></div>

<script src="https://unpkg.com/peerjs@1/dist/peerjs.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const toastBox = $("toastBox");
const canvas = $("board");
const ctx = canvas.getContext("2d");

let peer, conn;
let myColor = 1;
let turn = 1;
let board = Array(15).fill().map(()=>Array(15).fill(0));
let notifOk = false;
const grid = 32;

// Toast提示
function toast(msg){
  toastBox.innerText = msg;
  toastBox.style.display = "block";
  setTimeout(()=>toastBox.style.display="none",2200);
}

// ========== 通知按钮（已修复async，加提示） ==========
$("notifyBtn").onclick = function(){
  if(!("Notification" in window)){
    toast("当前浏览器不支持桌面通知");
    return;
  }
  if(window.location.protocol !== "https:"){
    toast("桌面通知需要HTTPS环境");
    return;
  }
  Notification.requestPermission().then(function(perm){
    if(perm === "granted"){
      notifOk = true;
      toast("✅桌面通知已开启");
      $("notifyBtn").textContent="通知已开启";
      $("notifyBtn").disabled=true;
    }else if(perm === "denied"){
      toast("❌浏览器已拒绝通知，请在地址栏锁图标手动设置权限");
    }else{
      toast("⚠️通知未授予，仅网页弹窗生效");
    }
    console.log("通知权限结果：",perm);
  });
};
// 发送系统通知
function notifySend(title,body){
  if(!notifOk) return;
  new Notification(title,{
    body:body,
    requireInteraction:true
  })
}

// ========== Peer联机逻辑 ==========
function createRoom(){
  const id = $("myId").value.trim();
  if(!id) return toast("请填写房间ID");
  peer = new Peer(id);
  peer.on("open",()=>{
    $("status").innerText = `房间${id}已创建，等待对手加入`;
  })
  peer.on("connection",c=>bindConn(c));
  peer.on("error",e=>toast("创建失败："+e.type));
}
function connectPeer(){
  const tid = $("targetId").value.trim();
  const mid = $("myId").value.trim();
  if(!tid||!mid) return toast("请填写双方ID");
  peer = new Peer(mid);
  peer.on("open",()=>{
    $("status").innerText = "正在连接...";
    const c = peer.connect(tid);
    bindConn(c);
  })
}
function bindConn(c){
  conn = c;
  conn.on("open",()=>{
    $("status").innerText = "✅对战已连接";
    toast("对手已连上！");
    notifySend("五子棋","对手加入对局！");
  })
  conn.on("data",d=>{
    if(d.type==="put"){
      board[d.y][d.x] = d.color;
      turn = d.color===1?2:1;
      drawBoard();
      checkWin();
    }
  })
  conn.on("close",()=>{
    $("status").innerText = "连接断开";
    toast("对手离线");
  })
}

// ========== 棋盘绘制 & 落子 ==========
function drawBoard(){
  ctx.fillStyle="#deb887";
  ctx.fillRect(0,0,480,480);
  ctx.strokeStyle="#333";
  for(let i=0;i<15;i++){
    ctx.beginPath();
    ctx.moveTo(grid/2+i*grid, grid/2);
    ctx.lineTo(grid/2+i*grid, 480-grid/2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(grid/2, grid/2+i*grid);
    ctx.lineTo(480-grid/2, grid/2+i*grid);
    ctx.stroke();
  }
  // 星位
  const stars = [[3,3],[11,3],[7,7],[3,11],[11,11]];
  ctx.fillStyle="#333";
  stars.forEach(([x,y])=>{
    ctx.beginPath();
    ctx.arc(grid/2+x*grid, grid/2+y*grid,4,0,Math.PI*2);
    ctx.fill();
  })
  // 棋子
  for(let y=0;y<15;y++){
    for(let x=0;x<15;x++){
      const v = board[y][x];
      if(!v) continue;
      ctx.beginPath();
      ctx.arc(grid/2+x*grid, grid/2+y*grid,13,0,Math.PI*2);
      ctx.fillStyle = v===1?"#000":"#fff";
      ctx.fill();
      ctx.strokeStyle="#333";
      ctx.stroke();
    }
  }
}
canvas.onclick = e=>{
  if(!conn) return toast("还没有连接对手");
  if(turn!==myColor) return toast("不是你的回合");
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  let x = Math.round((mx-grid/2)/grid);
  let y = Math.round((my-grid/2)/grid);
  if(x<0||x>=15||y<0||y>=15||board[y][x]) return;
  board[y][x] = myColor;
  conn.send({type:"put",x,y,color:myColor});
  turn = myColor===1?2:1;
  drawBoard();
  checkWin();
}
function checkWin(){
  const dirs = [[1,0],[0,1],[1,1],[1,-1]];
  for(let y=0;y<15;y++){
    for(let x=0;x<15;x++){
      const c = board[y][x];
      if(!c) continue;
      for(let [dx,dy] of dirs){
        let cnt=1;
        for(let s=1;s<5;s++){
          const nx=x+dx*s,ny=y+dy*s;
          if(nx<0||ny<0||nx>=15||ny>=15||board[ny][nx]!==c) break;
          cnt++;
        }
        for(let s=1;s<5;s++){
          const nx=x-dx*s,ny=y-dy*s;
          if(nx<0||ny<0||nx>=15||ny>=15||board[ny][nx]!==c) break;
          cnt++;
        }
        if(cnt>=5){
          toast(c===1?"黑方获胜！":"白方获胜！");
          notifySend("对局结束", c===1?"黑方获胜！":"白方获胜！");
          return;
        }
      }
    }
  }
}
drawBoard();
</script>
</body>
</html>
