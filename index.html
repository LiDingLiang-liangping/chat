<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>联机大厅</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{display:grid;grid-template-columns:1fr 320px;height:100vh;overflow:hidden}
#pluginWrap{background:#111}
#chatSide{display:flex;flex-direction:column;border-left:1px solid #aaa;background:#fff}
#chatLog{flex:1;overflow-y:auto;padding:8px}
.msg{margin:3px 0;font-size:14px}
.system{color:#777}
#chatInputBar{display:flex;padding:8px;border-top:1px solid #aaa}
#chatInput{flex:1;padding:6px}
#sendBtn{padding:6px 10px;cursor:pointer}
iframe{width:100%;height:100%;border:none}
</style>
</head>
<body>
<div id="pluginWrap"></div>
<div id="chatSide">
  <div id="chatLog"></div>
  <div id="chatInputBar">
    <input id="chatInput" placeholder="发送消息，#world / #gobang 加载插件">
    <button id="sendBtn">发送</button>
  </div>
</div>

<script>
const pluginWrap = document.getElementById("pluginWrap");
const chatLog = document.getElementById("chatLog");
const chatInput = document.getElementById("chatInput");
const sendBtn = document.getElementById("sendBtn");
let currentIframe = null;

function addMsg(text, cls=""){
  const div = document.createElement("div");
  div.className = "msg "+cls;
  div.textContent = text;
  chatLog.appendChild(div);
  chatLog.scrollTop = chatLog.scrollHeight;
}

function loadPlugin(url){
  // 销毁旧iframe，清定时器/peer上下文
  if(currentIframe){
    currentIframe.src = "javascript:false";
    currentIframe.remove();
    currentIframe = null;
  }
  const iframe = document.createElement("iframe");
  iframe.src = url;
  pluginWrap.appendChild(iframe);
  currentIframe = iframe;
  addMsg("[系统] 加载插件："+url,"system");
}

function handleInput(text){
  const t = text.trim();
  if(!t) return;
  addMsg("[你] "+t);
  if(t === "#world"){
    loadPlugin("world.html");
  }else if(t === "#gobang"){
    loadPlugin("gobang.html");
  }else{
    addMsg("[全局广播] "+t,"system");
  }
}

sendBtn.onclick = ()=>{
  handleInput(chatInput.value);
  chatInput.value="";
}
chatInput.onkeydown = e=>{
  if(e.key==="Enter"){
    handleInput(chatInput.value);
    chatInput.value="";
  }
}
addMsg("[系统] 欢迎！指令：#world 多人世界 | #gobang 五子棋","system");
</script>
</body>
</html>
