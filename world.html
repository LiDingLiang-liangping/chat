<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>版本选择</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,sans-serif;}
body{
    background-color:#f5f7fa;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:32px;
}
h1{
    font-size:36px;
    color:#222;
}
.btn-group{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
    justify-content:center;
}
button{
    padding:18px 42px;
    border:none;
    border-radius:14px;
    font-size:26px;
    color:white;
    cursor:pointer;
}
.btn-new{background-color:#2563eb;}
.btn-old{background-color:#6b7280;}
.btn-w0{background-color:#059669;}
</style>
</head>
<body>
<h1>请选择版本</h1>
<div class="btn-group">
<button class="btn-new" id="btnNew">New 新版</button>
<button class="btn-old" id="btnOld">Old 旧版</button>
<button class="btn-w0" id="btnW0">World0</button>
</div>

<script>
// 获取当前页面的查询字符串（?room=World%201&name=1）
const search = window.location.search;

document.getElementById('btnNew').onclick = ()=>{
    location.href = "world_new.html" + search;
}
document.getElementById('btnOld').onclick = ()=>{
    location.href = "world1.html" + search;
}
document.getElementById('btnW0').onclick = ()=>{
    location.href = "world0.html" + search;
}
</script>
</body>
</html>
