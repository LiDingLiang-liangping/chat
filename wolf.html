<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文字狼人杀（全自动法官·轮流行动）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{padding:10px;background:#f6f6f6}
.wrapper{display:flex;gap:12px;max-width:1200px;margin:0 auto;flex-wrap:wrap}
.left{flex:1;min-width:300px}
.right{width:320px;max-width:100%;display:flex;flex-direction:column;gap:10px}

.card{background:#fff;border:1px solid #ddd;border-radius:8px;padding:10px;margin-bottom:10px}
h3{font-size:15px;margin-bottom:8px}
button{padding:6px 10px;font-size:14px;border:none;border-radius:5px;background:#eee;cursor:pointer}
button:hover{background:#ddd}
button.primary{background:#2f6fed;color:#fff}
button.danger{background:#d9534f;color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}

#players{list-style:none;display:flex;flex-wrap:wrap;gap:6px}
#players li{padding:4px 10px;background:#eef2fb;border-radius:12px;font-size:13px}
#players li.dead{background:#f2f2f2;color:#999;text-decoration:line-through}

#roleCard{font-size:15px}
#roleCard .role-name{font-size:20px;font-weight:bold}
.camp-wolf{color:#c00}
.camp-good{color:#0066cc}
.role-tip{color:#666;font-size:13px;margin-top:6px}

#actionArea{margin-top:10px}
.action-label{font-weight:bold;margin-bottom:6px}
.act-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.act-row button{background:#eaf2ff;color:#123}

#log{
  height:300px;overflow-y:auto;background:#fff;border:1px solid #ddd;border-radius:6px;padding:8px;font-size:14px;
}
.log-line{margin:3px 0;line-height:1.4;word-break:break-all}
.log-ann{color:#555;font-weight:bold}
.log-death{color:#c00;font-weight:bold}
.log-speak{color:#222}
.log-me{color:#0066cc}
.log-sys{color:#888;font-style:italic}

#chatArea{display:flex;gap:6px;margin-top:6px}
#chatInput{flex:1;padding:8px;font-size:15px;border:1px solid #bbb;border-radius:6px}
#timer{font-size:13px;color:#b06200;margin-top:4px}
#phaseTitle{font-size:16px;font-weight:bold;margin-bottom:4px}
#status{color:#226;font-size:13px}
input[type=text]{padding:6px 8px;font-size:14px;border:1px solid #bbb;border-radius:5px}
</style>
</head>
<body>
<div class="wrapper">
  <div class="left">
    <div class="card">
      <h3>狼人杀房间</h3>
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        <input type="text" id="roomInput" placeholder="房间ID" value="Play 1" style="width:110px">
        <input type="text" id="nameInput" placeholder="你的昵称" style="width:100px">
        <button id="createBtn">创建(主机)</button>
        <button id="joinBtn">加入</button>
        <button id="startBtn" class="primary" disabled>开始游戏(5-10人)</button>
        <span id="status">等待操作</span>
      </div>
      <div style="margin-top:8px">
        <span style="font-size:13px;color:#888">在线玩家(<span id="pcount">0</span>)：</span>
        <ul id="players"></ul>
      </div>
    </div>

    <div class="card" id="roleCard" style="display:none">
      <div>你的身份：<span class="role-name" id="myRoleName"></span></div>
      <div class="role-tip" id="roleTip"></div>
      <div class="role-tip" id="teamMate" style="color:#333"></div>
    </div>

    <div class="card">
      <div id="phaseTitle">大厅</div>
      <div id="timer"></div>
      <div id="actionArea"></div>
    </div>
  </div>

  <div class="right">
    <div class="card" style="display:flex;flex-direction:column">
      <h3>游戏记录 / 白天发言</h3>
      <div id="log"></div>
      <div id="chatArea">
        <input type="text" id="chatInput" placeholder="白天发言（发言阶段才能发）">
        <button id="chatSend">发言</button>
      </div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/peerjs@1/dist/peerjs.min.js"></script>
<script>
// ============ 常量与工具 ============
const ROLE_NAMES = {wolf:"🐺狼人", villager:"👤村民", seer:"🔮预言家", witch:"🧪女巫", hunter:"🔫猎人"};
const CAMP = {wolf:"wolf", villager:"good", seer:"good", witch:"good", hunter:"good"};
const ROLE_TIPS = {
  wolf:"每晚和狼队友一起，轮到狼人阶段时选择击杀一名玩家。狼人彼此认识。",
  villager:"没有特殊技能，白天靠发言找出狼人并投票放逐。夜晚闭眼等待。",
  seer:"轮到预言家阶段时，可以查验一名玩家，得知对方是狼人还是好人。",
  witch:"拥有一瓶解药和一瓶毒药（各一次）。轮到女巫阶段时可选择救回今晚被杀者，或用毒药毒死一名玩家。",
  hunter:"被放逐或被杀出局时（毒杀除外），可以开枪带走一名玩家。"
};
function buildRoles(n){
  if(n===5) return ["wolf","villager","villager","seer","witch"];
  if(n===6) return ["wolf","wolf","villager","villager","seer","witch"];
  if(n===7) return ["wolf","wolf","villager","villager","villager","seer","witch"];
  if(n===8) return ["wolf","wolf","villager","villager","villager","seer","witch","hunter"];
  if(n===9) return ["wolf","wolf","wolf","villager","villager","villager","seer","witch","hunter"];
  if(n===10) return ["wolf","wolf","wolf","villager","villager","villager","villager","seer","witch","hunter"];
  return [];
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmtTime(d){ const p=n=>String(n).padStart(2,"0"); return `${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; }

// ============ DOM ============
const $ = id=>document.getElementById(id);
const roomInput=$("roomInput"), nameInput=$("nameInput");
const createBtn=$("createBtn"), joinBtn=$("joinBtn"), startBtn=$("startBtn");
const statusEl=$("status"), playersEl=$("players"), pcountEl=$("pcount");
const roleCard=$("roleCard"), myRoleName=$("myRoleName"), roleTip=$("roleTip"), teamMate=$("teamMate");
const phaseTitle=$("phaseTitle"), timerEl=$("timer"), actionArea=$("actionArea");
const log=$("log"), chatInput=$("chatInput"), chatSend=$("chatSend");

let peer, isHost=false, roomId, myName="";
let meId = isHost ? "host" : "";
let connections = new Map();
let players = [];
let gameRunning=false, gameOver=false;
let phase="lobby";
let day=0;
let phaseTimer=null, timeLeft=0;

// 本机身份
let myRole=null, myPlayer=null, wolves=[];

// 夜晚数据（主机持有）
let wolfKillTarget=null;
let seerChecked=false;
let witchSaveUsed=false, witchPoisonUsed=false;

function alive(){ return players.filter(p=>p.alive); }
function wolfPlayers(){ return players.filter(p=>p.role==="wolf"&&p.alive); }
function countAlive(){ return players.filter(p=>p.alive).length; }

function logAdd(html, cls="log-ann"){
  const d=document.createElement("div");
  d.className="log-line "+cls;
  d.innerHTML=html;
  log.appendChild(d);
  log.scrollTop=log.scrollHeight;
}
function logSys(t){ logAdd(esc(t),"log-sys"); }
function logAnn(t){ logAdd(esc(t),"log-ann"); }

// ============ 计时器/阶段（主机与客户端通用 UI） ============
function clearTimer(){ clearInterval(phaseTimer); phaseTimer=null; timerEl.textContent=""; }
function setPhaseTitle(label, seconds){
  phaseTitle.textContent=label;
  clearTimer();
  if(seconds){
    timeLeft=seconds;
    timerEl.textContent=`⏱ ${timeLeft}秒`;
    phaseTimer=setInterval(()=>{ timeLeft--; if(timeLeft<=0) timerEl.textContent=""; else timerEl.textContent=`⏱ ${timeLeft}秒`; },1000);
  }
}

// ============ 主机权威逻辑 ============
function broadcast(msg){ for(const c of connections.values()) if(c.open) c.send(msg); }
function sendTo(id, msg){ if(id==="host"){ handleServerMsg(msg); } else { const c=connections.get(id); if(c&&c.open) c.send(msg); } }

// 主机设置阶段并广播给所有客户端
function hostSetPhase(p, label, seconds){
  phase=p;
  setPhaseTitle(label, seconds);
  broadcast({type:"phase", phase:p, label, seconds});
  updateAllActions();
}

function startGame(){
  const n=players.length;
  if(n<5 || n>10){ logSys(`需要5~10人才能开始，当前${n}人`); return; }
  const roles=shuffle(buildRoles(n));
  players.forEach((p,i)=>{ p.role=roles[i]; p.alive=true; p.antidote=true; p.poison=true; });
  wolves = players.filter(p=>p.role==="wolf");
  gameRunning=true; gameOver=false; day=0;
  // 广播完整玩家+角色给所有人（含主机自己）
  const payload = players.map(p=>({id:p.id,name:p.name,role:p.role,alive:p.alive}));
  broadcast({type:"gameStart", players:payload});
  handleServerMsg({type:"gameStart", players:payload});
  logSys("🎮 游戏开始！身份已发到每个人手中。");
  startBtn.disabled=true;
  startNight();
}

// 夜晚：狼人 -> 预言家 -> 女巫 轮流
function startNight(){
  day++;
  wolfKillTarget=null; seerChecked=false;
  players.forEach(p=>{ p.killTarget=null; p.vote=null; p.witchSave=false; p.witchPoison=null; });
  logAnn(`🌙 第 ${day} 天夜晚降临。`);
  nightWolfPhase();
}
function nightWolfPhase(){
  hostSetPhase("night-wolf","🌙 狼人行动（杀谁？）",30);
  broadcast({type:"announce", text:"🌙 狼人请选择今晚的击杀目标（狼队友投票，多数决）。"});
  // 通知狼人各自的行动（客户端在 phase 里自行渲染按钮）
  setTimeout(()=>{ if(phase==="night-wolf") afterWolfPhase(); },30000);
}
function afterWolfPhase(){
  // 狼人击杀多数决
  const votes={};
  wolfPlayers().forEach(w=>{ if(w.killTarget) votes[w.killTarget]=(votes[w.killTarget]||0)+1; });
  let max=0, tie=false, target=null;
  for(const id in votes){ if(votes[id]>max){ max=votes[id]; target=id; tie=false; } else if(votes[id]===max && max>0){ tie=true; } }
  wolfKillTarget = tie ? null : target;
  nightSeerPhase();
}
function nightSeerPhase(){
  hostSetPhase("night-seer","🔮 预言家行动（查验谁？）",30);
  broadcast({type:"announce", text:"🔮 预言家请选择一名玩家查验。"});
  setTimeout(()=>{ if(phase==="night-seer") afterSeerPhase(); },30000);
}
function afterSeerPhase(){
  nightWitchPhase();
}
function nightWitchPhase(){
  hostSetPhase("night-witch","🧪 女巫行动（救/毒？）",30);
  // 只告诉女巫今晚被杀者是谁
  const witch = players.find(p=>p.role==="witch"&&p.alive);
  if(witch){
    const killName = wolfKillTarget ? (players.find(p=>p.id===wolfKillTarget)||{}).name : "无（狼人未达成一致）";
    sendTo(witch.id,{type:"witchInfo", killName, saveAvailable:witch.antidote, poisonAvailable:witch.poison});
  }
  broadcast({type:"announce", text:"🧪 女巫行动（解药/毒药各一次）。"});
  setTimeout(()=>{ if(phase==="night-witch") afterWitchPhase(); },30000);
}
function afterWitchPhase(){
  resolveNight();
}

function resolveNight(){
  // 结算死亡
  const witch = players.find(p=>p.role==="witch"&&p.alive);
  let saved=false, poisonTarget=null;
  if(witch){
    saved = !!witch.witchSave;
    poisonTarget = witch.witchPoison || null;
  }
  const deaths=[];
  if(wolfKillTarget && !saved){ const kp=players.find(p=>p.id===wolfKillTarget); if(kp&&kp.alive){ kp.alive=false; deaths.push(kp); } }
  if(poisonTarget){ const pp=players.find(p=>p.id===poisonTarget); if(pp&&pp.alive){ pp.alive=false; deaths.push(pp); } }

  if(deaths.length===0){
    broadcast({type:"nightResult", text:"昨晚是平安夜，无人死亡。"});
    logAnn("☀️ 天亮了，昨晚是平安夜，无人死亡。");
  }else{
    const names=deaths.map(d=>d.name).join("、");
    broadcast({type:"nightResult", text:`昨晚 ${names} 死亡。`});
    logAdd(`☀️ 天亮了，昨晚死亡：<b>${esc(names)}</b>`,"log-death");
  }

  // 猎人被刀杀可开枪
  const hunterKilled = deaths.find(d=>d.role==="hunter" && wolfKillTarget && d.id===wolfKillTarget && !saved);
  if(hunterKilled){ gunPhase(hunterKilled.id,"夜里被狼人击杀"); return; }

  const w=checkWin();
  if(w){ endGame(w); return; }
  startDaySpeak();
}

function gunPhase(targetId, reason){
  hostSetPhase("gun","🔫 猎人开枪",15);
  const hunter=players.find(p=>p.id===targetId);
  logSys(`🔫 猎人【${hunter.name}】${reason}，可以开枪带走一名玩家！`);
  broadcast({type:"gun", targetId, reason});
  setTimeout(()=>{ if(phase==="gun"){ broadcast({type:"announce", text:"猎人未开枪。"}); logSys("猎人未开枪。"); afterGun(); } },15000);
}
function afterGun(){
  const w=checkWin();
  if(w){ endGame(w); return; }
  startDaySpeak();
}

function startDaySpeak(){
  hostSetPhase("daySpeak",`💬 第 ${day} 天 · 白天发言`,45);
  broadcast({type:"announce", text:`💬 白天发言阶段（${45}秒），存活玩家轮流发言讨论。`});
  setTimeout(()=>{ if(phase==="daySpeak") startDayVote(); },45000);
}
function startDayVote(){
  hostSetPhase("dayVote",`🗳 第 ${day} 天 · 投票放逐`,30);
  players.forEach(p=>{ p.vote=null; });
  broadcast({type:"announce", text:"🗳 开始投票！请存活玩家选择要放逐的人。"});
  setTimeout(()=>{ if(phase==="dayVote") resolveDayVote(); },30000);
}
function resolveDayVote(){
  const votes={};
  players.filter(p=>p.alive).forEach(p=>{ if(p.vote) votes[p.vote]=(votes[p.vote]||0)+1; });
  let max=0, tie=false, exile=null;
  for(const id in votes){ if(votes[id]>max){ max=votes[id]; exile=id; tie=false; } else if(votes[id]===max && max>0){ tie=true; } }
  if(tie) exile=null;
  if(!exile){
    broadcast({type:"voteResult", text:"投票平票，无人被放逐。"});
    logSys("🗳 平票，无人被放逐。");
    const w=checkWin(); if(w){ endGame(w); return; }
    startNight();
    return;
  }
  const ex=players.find(p=>p.id===exile);
  ex.alive=false;
  broadcast({type:"voteResult", text:`${ex.name} 被投票放逐出局！`});
  logAdd(`🗳 <b>${esc(ex.name)}</b> 被放逐出局！`,"log-death");
  if(ex.role==="hunter"){ gunPhase(ex.id,"被投票放逐"); return; }
  const w=checkWin(); if(w){ endGame(w); return; }
  startNight();
}

function checkWin(){
  const wolfCount=players.filter(p=>p.alive&&p.role==="wolf").length;
  const goodCount=players.filter(p=>p.alive&&p.role!=="wolf").length;
  if(wolfCount===0) return "good";
  if(wolfCount>=goodCount) return "wolf";
  return null;
}
function endGame(winner){
  gameOver=true; gameRunning=false;
  clearTimer();
  const text = winner==="good" ? "🎉 好人阵营胜利！狼人全部被消灭！" : "🐺 狼人阵营胜利！狼人已掌控全场！";
  hostSetPhase("gameover","游戏结束",0);
  broadcast({type:"gameOver", winner});
  logAdd("🏁 游戏结束：<b>"+esc(text)+"</b>","log-death");
  let info="";
  players.forEach(p=>{ info+=`${p.name}: ${ROLE_NAMES[p.role]}${p.alive?"(存活)":"(死亡)"}；`; });
  logSys("身份公布："+info);
}

// ============ 本机动作渲染（主机/客户端通用） ============
function updateAllActions(){
  if(!gameRunning){ actionArea.innerHTML=phase==="lobby"?"<div class='action-label'>等待游戏开始...</div>":""; return; }
  const me=myPlayer;
  if(!me){ actionArea.innerHTML="<div class='action-label'>等待身份...</div>"; return; }
  const aliveList=alive();
  let html="";

  if(phase==="night-wolf"){
    if(myRole==="wolf" && me.alive){
      html+=`<div class="action-label">🌙 狼人行动：选择今晚击杀目标（狼队友投票多数决）</div><div class="act-row">`;
      aliveList.filter(p=>p.role!=="wolf").forEach(p=>{ html+=`<button data-act="wolfkill" data-id="${p.id}">${esc(p.name)}</button>`; });
      html+=`<button data-act="wolfkill" data-id="">放弃</button></div>`;
    }else{
      html+=`<div class="action-label">🌙 狼人行动中...（闭眼等待）</div>`;
    }
  }else if(phase==="night-seer"){
    if(myRole==="seer" && me.alive){
      html+=`<div class="action-label">🔮 预言家行动：查验一名玩家</div><div class="act-row">`;
      aliveList.filter(p=>p.id!==me.id).forEach(p=>{ html+=`<button data-act="seer" data-id="${p.id}">${esc(p.name)}</button>`; });
      html+=`</div>`;
    }else{
      html+=`<div class="action-label">🔮 预言家行动中...（闭眼等待）</div>`;
    }
  }else if(phase==="night-witch"){
    if(myRole==="witch" && me.alive){
      html+=`<div class="action-label">🧪 女巫行动</div>`;
      if(me.antidote){
        html+=`<div class="action-label" style="font-weight:normal">解药（救回今晚被杀者：<span id="witchKillName">...</span>）</div>`;
        html+=`<div class="act-row"><button data-act="witchsave" data-id="">使用解药救人</button><button data-act="witchsave" data-id="">不使用解药</button></div>`;
      }else{
        html+=`<div class="action-label" style="font-weight:normal;color:#999">解药已用完</div>`;
      }
      if(me.poison){
        html+=`<div class="action-label" style="margin-top:4px">毒药：选择毒杀目标</div><div class="act-row">`;
        aliveList.filter(p=>p.id!==me.id).forEach(p=>{ html+=`<button data-act="witchpoison" data-id="${p.id}">${esc(p.name)}</button>`; });
        html+=`<button data-act="witchpoison" data-id="">不用毒药</button></div>`;
      }else{
        html+=`<div class="action-label" style="font-weight:normal;color:#999;margin-top:4px">毒药已用完</div>`;
      }
    }else{
      html+=`<div class="action-label">🧪 女巫行动中...（闭眼等待）</div>`;
    }
  }else if(phase==="daySpeak"){
    if(me.alive) html+=`<div class="action-label">💬 白天发言阶段，请在右侧聊天区发言</div>`;
    else html+=`<div class="action-label">😵 你已出局，可观看但不可发言</div>`;
  }else if(phase==="dayVote"){
    if(me.alive){
      html+=`<div class="action-label">🗳 投票：选择要放逐的玩家</div><div class="act-row">`;
      aliveList.filter(p=>p.id!==me.id).forEach(p=>{ html+=`<button data-act="vote" data-id="${p.id}">${esc(p.name)}</button>`; });
      html+=`</div>`;
    }else{ html+=`<div class="action-label">😵 你已出局，无法投票</div>`; }
  }else if(phase==="gun"){
    if(myRole==="hunter" && !me.alive){
      html+=`<div class="action-label">🔫 你出局了，选择开枪带走一名玩家（或不带）</div><div class="act-row">`;
      aliveList.filter(p=>p.id!==me.id).forEach(p=>{ html+=`<button data-act="gun" data-id="${p.id}">${esc(p.name)}</button>`; });
      html+=`<button data-act="gun" data-id="">不开枪</button></div>`;
    }else{ html+=`<div class="action-label">🔫 猎人行动中...</div>`; }
  }else if(phase==="gameover"){
    html+=`<div class="action-label">🏁 游戏已结束</div>`;
  }else{
    html+=`<div class="action-label">${phase==="lobby"?"等待游戏开始":"等待..."}</div>`;
  }
  actionArea.innerHTML=html;
}

// ============ 消息处理（主机自用 + 客户端收到主机广播） ============
function handleServerMsg(msg){
  if(msg.type==="gameStart"){
    players = msg.players.map(p=>({id:p.id,name:p.name,role:p.role,alive:p.alive,antidote:true,poison:true}));
    myPlayer = players.find(p=>p.id===meId);
    myRole = myPlayer ? myPlayer.role : null;
    gameRunning=true; gameOver=false;
    roleCard.style.display="block";
    myRoleName.textContent=ROLE_NAMES[myRole];
    myRoleName.className="role-name "+(CAMP[myRole]==="wolf"?"camp-wolf":"camp-good");
    roleTip.textContent=ROLE_TIPS[myRole];
    teamMate.textContent = myRole==="wolf" ? ("你的狼队友："+players.filter(p=>p.role==="wolf"&&p.id!==meId).map(p=>p.name).join("、") || "（没有其他狼）") : "";
    renderPlayers(players.map(p=>({id:p.id,name:p.name,alive:p.alive})));
    updateAllActions();
  }else if(msg.type==="phase"){
    phase=msg.phase;
    setPhaseTitle(msg.label, msg.seconds);
    updateAllActions();
  }else if(msg.type==="witchInfo"){
    // 女巫看到被杀者
    if(myRole==="witch"){
      const el=document.getElementById("witchKillName");
      if(el) el.textContent = msg.killName;
    }
  }else if(msg.type==="seerResult"){
    logAnn(`🔮 查验结果：${esc(msg.name)} 是 ${msg.isWolf?"🐺狼人":"好人"}。`);
  }else if(msg.type==="nightResult" || msg.type==="voteResult"){
    // 结果由主机在本地用 logAdd 处理；客户端这里仅保证 UI 刷新
    updateAllActions();
  }else if(msg.type==="announce"){
    logAdd(esc(msg.text),"log-ann");
  }else if(msg.type==="chat"){
    logAdd(`<b>${esc(msg.name)}</b>：${esc(msg.text)}`, msg.name===myName?"log-me":"log-speak");
  }else if(msg.type==="gameOver"){
    gameOver=true; gameRunning=false;
    phase=msg.phase||"gameover";
    clearTimer();
    updateAllActions();
  }
}

function renderPlayers(list){
  playersEl.innerHTML="";
  list.forEach(p=>{
    const li=document.createElement("li");
    li.textContent=p.name;
    if(!p.alive) li.classList.add("dead");
    playersEl.appendChild(li);
  });
  pcountEl.textContent=list.length;
}

// 本机点击操作按钮
actionArea.addEventListener("click",(e)=>{
  const btn=e.target.closest("button[data-act]");
  if(!btn) return;
  const act=btn.dataset.act, id=btn.dataset.id;
  const msg={type:"act", act, target:id, from:meId};
  if(isHost) handleServerAction(msg);
  else{ const c=connections.get(roomId); if(c&&c.open) c.send(msg); }
});

// 主机处理行动（本机或客户端发来）
function handleServerAction(msg){
  const p=players.find(x=>x.id===msg.from);
  if(!p||!p.alive) return;
  if(phase==="night-wolf" && msg.act==="wolfkill" && p.role==="wolf"){
    p.killTarget = msg.target||null;
    logSys(`🐺 狼人已提交目标。`);
  }else if(phase==="night-seer" && msg.act==="seer" && p.role==="seer"){
    const t=players.find(x=>x.id===msg.target);
    if(t){ sendTo(msg.from,{type:"seerResult", name:t.name, isWolf:(t.role==="wolf")}); }
  }else if(phase==="night-witch" && p.role==="witch"){
    if(msg.act==="witchsave" && p.antidote){ p.witchSave=true; p.antidote=false; logSys(`🧪 女巫使用了解药。`); }
    if(msg.act==="witchpoison" && p.poison){ p.witchPoison=msg.target||null; p.poison=false; logSys(`🧪 女巫使用了毒药。`); }
  }else if(phase==="dayVote" && msg.act==="vote"){
    p.vote=msg.target;
    logSys(`🗳 ${p.name} 已投票。`);
  }else if(phase==="gun" && msg.act==="gun" && p.role==="hunter"){
    clearTimer();
    if(msg.target){
      const t=players.find(x=>x.id===msg.target);
      if(t&&t.alive){ t.alive=false; broadcast({type:"voteResult",text:`🔫 猎人带走了 ${t.name}！`}); logAdd(`🔫 猎人带走 <b>${esc(t.name)}</b>！`,"log-death"); }
    }else{
      logSys("猎人未开枪。");
    }
    broadcast({type:"announce", text:"🔫 猎人行动结束"});
    setTimeout(()=>{ const w=checkWin(); if(w){ endGame(w); } else { startDaySpeak(); } }, 400);
  }
}

// 客户端收到主机广播
function handleClientMsg(msg){
  if(msg.type==="chat"){ logAdd(`<b>${esc(msg.name)}</b>：${esc(msg.text)}`, msg.name===myName?"log-me":"log-speak"); }
  else handleServerMsg(msg);
}

// 本机发言
function sendSpeak(){
  const text=chatInput.value.trim();
  if(!text) return;
  if(!gameRunning || phase!=="daySpeak"){ logSys("现在不在发言阶段，不能发言。"); return; }
  const p=players.find(x=>x.id===meId);
  if(p&&!p.alive){ logSys("你已出局，不能发言。"); return; }
  if(isHost){
    logAdd(`<b>${esc(myName)}</b>：${esc(text)}`,"log-me");
    broadcast({type:"chat",name:myName,text});
  }else{
    const c=connections.get(roomId);
    if(c&&c.open) c.send({type:"speak", name:myName, text});
  }
  chatInput.value="";
}
chatSend.onclick=sendSpeak;
chatInput.addEventListener("keydown",e=>{ if(e.key==="Enter") sendSpeak(); });

// ============ Peer 连接 ============
function updatePlayerList(){
  renderPlayers(players.map(p=>({id:p.id,name:p.name,alive:p.alive})));
  pcountEl.textContent=players.length;
  startBtn.disabled = (gameRunning || players.length<5);
}

createBtn.onclick=()=>{
  roomId=roomInput.value.trim(); myName=nameInput.value.trim();
  if(!roomId||!myName) return alert("填写房间ID和昵称！");
  isHost=true; meId="host";
  statusEl.textContent=`✅ 主机，房间:${roomId}`;
  peer=new Peer(roomId);
  peer.on("open",()=>{ logSys("房间创建成功，等待玩家加入..."); });
  peer.on("error",err=>{ alert("主机Peer错误:"+err); statusEl.textContent="主机出错"; });
  peer.on("connection",conn=>{
    connections.set(conn.peer,conn);
    logSys(`有玩家接入，当前${connections.size+1}人`);
    conn.on("data",data=>{
      if(data.type==="join") registerPlayer(conn.peer, data.name);
      else if(data.type==="speak"){ logAdd(`<b>${esc(data.name)}</b>：${esc(data.text)}`,"log-speak"); broadcast({type:"chat",name:data.name,text:data.text}); }
      else if(data.type==="act") handleServerAction(data);
      else if(data.type==="chat"&&gameOver){ logAdd(`<b>${esc(data.name)}</b>：${esc(data.text)}`,"log-speak"); broadcast({type:"chat",name:data.name,text:data.text}); }
    });
    conn.on("close",()=>{
      connections.delete(conn.peer);
      players=players.filter(p=>p.id!==conn.peer);
      updatePlayerList();
      logSys(`玩家离开，当前${players.length}人`);
      broadcast({type:"state", players:players.map(p=>({id:p.id,name:p.name,alive:p.alive}))});
    });
  });
  players=[{id:"host",name:myName,role:null,alive:true,antidote:true,poison:true}];
  myPlayer=players[0]; meId="host";
  updatePlayerList();
};

function registerPlayer(id,name){
  if(players.some(p=>p.name===name)){ const c=connections.get(id); if(c&&c.open) c.send({type:"announce",text:`昵称「${name}」已被占用，请换一个。`}); return; }
  if(players.some(p=>p.id===id)) return;
  players.push({id,name,role:null,alive:true,antidote:true,poison:true});
  updatePlayerList();
  logSys(`✅ ${name} 加入游戏`);
  broadcast({type:"state", players:players.map(p=>({id:p.id,name:p.name,alive:p.alive}))});
  if(gameRunning) broadcast({type:"announce", text:`${name} 在游戏进行中加入了房间（旁观）`});
  startBtn.disabled = (gameRunning || players.length<5);
}

joinBtn.onclick=()=>{
  roomId=roomInput.value.trim(); myName=nameInput.value.trim();
  if(!roomId||!myName) return alert("填写房间ID和昵称！");
  isHost=false;
  statusEl.textContent="🔄 连接主机...";
  peer=new Peer();
  peer.on("open",()=>{
    const conn=peer.connect(roomId,{serialization:"json",reliable:true});
    connections.set(roomId,conn);
    meId=peer.id;
    conn.on("open",()=>{ statusEl.textContent="✅ 已连接，等待发牌"; conn.send({type:"join", name:myName}); });
    conn.on("data",data=>{
      if(data.type==="state"){ renderPlayers(data.players); }
      else handleClientMsg(data);
    });
    conn.on("close",()=>{ statusEl.textContent="❌ 断开连接"; });
    conn.on("error",err=>{ alert("连接错误:"+err); });
  });
  peer.on("error",err=>{ alert("Peer初始化失败:"+err); });
};

startBtn.onclick=()=>{ if(isHost) startGame(); };
</script>
