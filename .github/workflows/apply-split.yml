name: apply-world-split
on:
  push:
    paths:
      - "build_world_split.py"
permissions:
  contents: write
jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run split script
        run: python3 build_world_split.py
      - name: Commit and cleanup
        run: |
          git config user.name "split-bot"
          git config user.email "split-bot@users.noreply.github.com"
          git rm -q build_world_split.py .github/workflows/apply-split.yml
          git add -A
          git commit -m "refactor(world_new): 拆成 world_new/ 目录（css + js 模块），入口链接指向 world_new/index.html"
          git push
