name: apply-ff
on:
  push:
    paths:
      - '.github/workflows/apply-ff.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: patch
        run: |
          set -e
          sed -i 's/五行、技能、宗门、秘境、法宝等其余体系与新版基本一致。/五行、技能、宗门、秘境、坊市、聊天等其余体系与新版基本一致。/' ff.patch
          printf ' \n' >> ff.patch
          git apply --check ff.patch
          git apply ff.patch
      - name: verify
        run: |
          grep -q 'qw_ff_v1' world_new.html
          grep -q '与道友同行' world_new.html
          grep -q '友伤开关' world.md
          wc -c world_new.html world.md
      - name: commit
        run: |
          git config user.name 'patch-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -q ff.patch
          git add world_new.html world.md
          git commit -m 'feat: 友伤开关与煞气调整'
          git push
