name: patch-ff
on:
  push:
    paths:
      - '.github/workflows/patch-ff.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -fsSL 'https://aka.doubaocdn.com/s/zRhaoFfUke' -o world_new.html
          curl -fsSL 'https://aka.doubaocdn.com/s/W9tWZKQAqE' -o world.md
      - run: |
          grep -q '与道友同行' world_new.html
          grep -q 'qw_ff_v1' world_new.html
          grep -q '友伤' world.md
          wc -c world_new.html world.md
      - run: |
          git config user.name 'patch-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -q .github/workflows/patch-ff.yml
          git add world_new.html world.md
          git commit -m 'feat: 友伤开关 / 煞气数值调整'
          git push
