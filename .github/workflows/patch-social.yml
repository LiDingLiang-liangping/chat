name: patch-social
on:
  push:
    paths:
      - '.github/workflows/patch-social.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download
        run: curl -fsSL 'https://aka.doubaocdn.com/s/w4bjGbXvU6' -o world_new.html
      - name: verify
        run: |
          grep -q 'EMOTE_LIST' world_new.html
          grep -q 'hostGift' world_new.html
          grep -q 'hostMentor' world_new.html
          grep -q 'drawBubble' world_new.html
          wc -c world_new.html
      - name: commit
        run: |
          git config user.name 'patch-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -q .github/workflows/patch-social.yml
          git add world_new.html
          git commit -m 'feat: 聊天气泡/快捷动作/赠礼/师徒'
          git push
