name: patch-features
on:
  push:
    paths:
      - '.github/workflows/patch-features.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download
        run: curl -fsSL 'https://aka.doubaocdn.com/s/TdvrdVs9jv' -o world_new.html
      - name: verify
        run: |
          grep -q 'ACH_DEFS' world_new.html
          grep -q 'hostSpar' world_new.html
          grep -q 'ENCOUNTER_DEFS' world_new.html
          grep -q 'ART_DEFS' world_new.html
          wc -c world_new.html
      - name: commit
        run: |
          git config user.name 'patch-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -q .github/workflows/patch-features.yml
          git add world_new.html
          git commit -m 'feat: 称号成就/切磋/法宝碎片/随机奇遇'
          git push
