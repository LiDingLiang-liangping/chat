name: fix-join-serialization
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix client connect serialization
        run: |
          git config user.name "LiDingLiang-liangping"
          git config user.email "1791204370@qq.com"
          sed -i "s/hostConn = peer.connect(key, { reliable:true, serialization:'json' });/hostConn = peer.connect(key, { reliable:true });/" world_new.html
          git diff --quiet world_new.html && echo "NO CHANGE" && exit 0
          git add world_new.html
          git commit -m "Fix: remove json serialization on client connect so large init/snap messages arrive"
          git push origin HEAD:main
