name: apply-world-settings
on:
  push:
    paths:
      - '.github/workflows/apply-world-settings.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch updated world_new.html
        run: |
          set -e
          curl -fsSL 'https://aka.doubaocdn.com/s/h7VgwUYNgC' -o world_new.html
          ls -l world_new.html
          head -c 300 world_new.html | grep -q 'DOCTYPE html'
          grep -q 'settingsPanel' world_new.html
          grep -q 'tutorialBox' world_new.html
      - name: Commit
        run: |
          set -e
          git config user.name 'patch-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -q .github/workflows/apply-world-settings.yml || true
          git add world_new.html
          git commit -m 'feat(world_new): add settings panel (key binding / control mode) and beginner tutorial'
          git push
