name: patch-md
on:
  push:
    paths:
      - '.github/workflows/patch-md.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL 'https://aka.doubaocdn.com/s/icsoFoebpX' -o world.md
      - run: |
          grep -q '社交：头顶气泡' world.md
          wc -c world.md
      - run: |
          git config user.name 'patch-bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -q .github/workflows/patch-md.yml
          git add world.md
          git commit -m 'docs: 补充社交玩法说明'
          git push
